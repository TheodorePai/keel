name: Git snapshot and entrypoint portability

on:
  push:
    paths:
      - "keel/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/path-portability.yml"
  pull_request:
    paths:
      - "keel/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/path-portability.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paths:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.11", "3.12"]
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Show runtime versions
        run: python --version
      - name: Show Git version
        run: git --version
      # This gate covers A/B without hiding unrelated full-suite failures.
      # The new snapshot test exercises both core.autocrlf=false and true.
      - name: Check snapshot and entrypoint portability
        run: >-
          python -m unittest -v
          tests.test_snapshots
          tests.test_worktrees.TestWorktreeGit
          tests.test_entrypoints.TestMarkdownTargetMatching
          tests.test_entrypoints.TestEntrypointProtection.test_local_link_keeps_native_filename_semantics
          tests.test_entrypoints.TestEntrypointProtection.test_work_mode_link_still_requires_an_existing_file
          tests.test_entrypoints.TestEntrypointProtection.test_work_mode_check_uses_staged_entrypoint_not_worktree
          tests.test_entrypoints.TestEntrypointProtection.test_new_work_mode_requirement_does_not_retroactively_invalidate_history
          tests.test_init.TestInitLayout
          tests.test_skills.TestSkills.test_init_copies_keel_skill_and_mirror
          tests.test_skills.TestSkills.test_init_upgrades_legacy_work_mode_pointer_and_keeps_project_rules
          tests.test_skills.TestSkills.test_work_mode_entrypoint_is_required_and_init_repairs_it_without_losing_rules
          tests.test_skills.TestSkills.test_work_mode_accepts_project_wording_and_relative_link_not_a_fixed_template
